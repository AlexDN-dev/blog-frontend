<div
  class="flex justify-center items-center min-h-[calc(100vh-5rem)] bg-gray-50/50"
>
  <div
    class="bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 w-full max-w-md mx-4"
  >
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-900">Welcome back</h2>
      <p class="text-gray-500 mt-2">Please enter your details to sign in</p>
    </div>

    <form class="space-y-6">
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email
        </label>
        <div class="relative">
          <input
            type="email"
            id="email"
            name="email"
            class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50/50 text-gray-900 outline-none transition-all duration-300 hover:bg-white focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            placeholder="Enter your email"
          />
        </div>
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50/50 text-gray-900 outline-none transition-all duration-300 hover:bg-white focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input
            type="checkbox"
            id="remember"
            name="remember"
            class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 transition-all duration-300"
          />
          <label for="remember" class="ml-2 block text-sm text-gray-700">
            Remember me
          </label>
        </div>
        <a
          href="#"
          class="text-sm font-medium text-blue-600 hover:text-blue-500 transition-colors duration-300"
        >
          Forgot password?
        </a>
      </div>

      <button
        type="submit"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 transform hover:scale-[1.02]"
      >
        Sign in
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-gray-100">
      <p class="text-center text-sm text-gray-500">
        Don't have an account?
        <a
          routerLink="/sign-up"
          class="font-medium text-blue-600 hover:text-blue-500 transition-colors duration-300"
        >
          Sign up
        </a>
      </p>
    </div>
  </div>
</div>
