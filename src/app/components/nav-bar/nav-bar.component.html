<div
  class="fixed top-0 left-0 right-0 z-50 bg-blue-600/95 backdrop-blur-sm text-white shadow-lg"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center">
        <h1 class="text-2xl font-bold tracking-tight">MyBlog</h1>
      </div>

      <!-- Burger menu for mobile -->
      <button
        type="button"
        class="burger absolute right-4 lg:hidden inline-flex items-center justify-center rounded-md p-2 hover:bg-blue-700/50 transition-colors"
        (click)="toggleMenu()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8"
          [class.rotate-180]="isMenuOpen"
          style="transition: transform 0.3s ease-in-out"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>

      <!-- Search bar - visible only on desktop -->
      <div class="hidden lg:flex items-center flex-1 justify-center px-8">
        <div class="relative w-full max-w-md">
          <input
            type="text"
            placeholder="Search friends..."
            class="w-full bg-blue-800/50 rounded-full px-4 py-2 pl-10 outline-none focus:ring-2 focus:ring-white/20 transition-all"
          />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="absolute left-3 top-1/2 -translate-y-1/2 size-5 text-white/70"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
        </div>
      </div>

      <!-- Desktop navigation -->
      <nav class="hidden lg:flex items-center gap-6">
        <a
          routerLink="/"
          class="text-sm font-medium relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-white after:transition-all hover:after:w-full"
          >Home</a
        >
        <a
          class="text-sm font-medium relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-white after:transition-all hover:after:w-full"
          >About the project</a
        >
        <a
          routerLink="/sign-in"
          class="ml-2 rounded-full bg-white px-4 py-1.5 text-sm font-medium text-blue-600 shadow-sm hover:bg-blue-500 hover:text-white transition-all duration-300 transform hover:scale-105"
        >
          Sign in
        </a>
      </nav>
    </div>
  </div>

  <!-- Mobile menu -->
  <div
    class="lg:hidden overflow-hidden transition-all duration-300 ease-in-out"
    [class.max-h-0]="!isMenuOpen"
    [class.max-h-[400px]]="isMenuOpen"
    style="transition: max-height 0.3s ease-in-out"
  >
    <div
      class="space-y-1 px-4 pb-3 pt-2 transform transition-all duration-300"
      [class.opacity-0]="!isMenuOpen"
      [class.translate-y-4]="!isMenuOpen"
      [class.opacity-100]="isMenuOpen"
      [class.translate-y-0]="isMenuOpen"
    >
      <!-- Search bar for mobile -->
      <div class="relative mb-4">
        <input
          type="text"
          placeholder="Search friends..."
          class="w-full bg-blue-700/50 rounded-full px-4 py-2 pl-10 outline-none focus:ring-2 focus:ring-white/20 transition-all"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="absolute left-3 top-1/2 -translate-y-1/2 size-5 text-white/70"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
      </div>

      <a
        routerLink="/"
        class="block rounded-lg px-3 py-2 text-base font-medium hover:bg-blue-700/50 hover:translate-x-2 transition-all duration-300"
        >Home</a
      >
      <a
        class="block rounded-lg px-3 py-2 text-base font-medium hover:bg-blue-700/50 hover:translate-x-2 transition-all duration-300"
        >About the project</a
      >
      <a
        routerLink="/sign-in"
        class="mt-4 block w-full rounded-full bg-white px-4 py-2 text-center text-base font-medium text-blue-600 shadow-sm hover:bg-blue-500 hover:text-white transition-all duration-300 transform hover:scale-105"
      >
        Sign in
      </a>
    </div>
  </div>
</div>
