<div class="flex flex-col justify-between gap-4">
  <h2 class="text-2xl font-semibold">Create a post !</h2>
  <textarea
    name="message"
    id="message"
    cols="0"
    rows="6"
    placeholder="Write your post here..."
    class="resize-none bg-gray-100 rounded-lg p-2 w-full outline-blue-400"
    [(ngModel)]="postContent"
  ></textarea>
  <div class="flex justify-end">
    <button
      [disabled]="!postContent.trim()"
      [ngClass]="{
        'bg-blue-500 hover:bg-blue-600': postContent.trim(),
        'bg-gray-400 cursor-not-allowed': !postContent.trim()
      }"
      class="text-white rounded-lg px-4 py-2 w-fit flex items-center gap-2 transition-all duration-300"
    >
      <p>Submit</p>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
        />
      </svg>
    </button>
  </div>
</div>
